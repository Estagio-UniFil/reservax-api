<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ReservaX - Salas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/salas.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-box">R</div>
            <h2>ReservaX</h2>
        </div>

        <nav class="menu">
            <a href="#">▦ <span>Dashboard</span></a>
            <a href="/solicitar-reserva">▣ <span>Solicitar Reserva</span></a>
            <a href="#">◷ <span>Minhas reservas</span></a>
            <a href="#" class="active">▤ <span>Salas</span></a>
            <a href="#">👥 <span>Usuários</span></a>
            <a href="#">⚙ <span>Configurações</span></a>
        </nav>

        <a href="#" class="logout">↪ <span>Sair</span></a>
    </aside>

    <main class="content">

        <header class="topbar">
            <h1>Salas</h1>

            <div class="user-area">
                <div class="bell">🔔</div>
                <div class="divider"></div>
                <div class="avatar">R</div>

                <div>
                    <strong>Tiago Galvão</strong>
                    <p>Coordenador</p>
                </div>
            </div>
        </header>

        <section class="page-body">

            <div class="filter-area">
                <div class="filtro-salas">
                    <button class="filter-button" id="botaoFiltroSalas" type="button">
                        Visualizar salas <span>∨</span>
                    </button>

                    <div class="menu-filtro-salas" id="menuFiltroSalas">
                        <button type="button" onclick="filtrarSalas('TODAS')">Todas</button>
                        <button type="button" onclick="filtrarSalas('SALA_AULA')">Sala de Aula</button>
                        <button type="button" onclick="filtrarSalas('LABORATORIO')">Laboratório</button>
                        <button type="button" onclick="filtrarSalas('AUDITORIO')">Auditório</button>
                        <button type="button" onclick="filtrarSalas('SALA_REUNIAO')">Sala de Reunião</button>
                        <button type="button" onclick="filtrarSalas('BIBLIOTECA')">Biblioteca</button>
                    </div>
                </div>
            </div>  

            <div class="cards-grid" id="listaSalas">
                <!-- Salas serão carregadas via JavaScript -->
            </div>

            <div class="add-area">
                <button class="add-button"
                        data-bs-toggle="modal"
                        data-bs-target="#modalNovaSala">
                    <span>+</span> Nova sala
                </button>
            </div>

        </section>

    </main>

</div>

<div class="modal fade"
     id="modalNovaSala"
     tabindex="-1"
     aria-labelledby="modalNovaSalaLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content modal-reservax">

            <div class="modal-header">
                <h5 class="modal-title" id="modalNovaSalaLabel">
                    Cadastrar nova sala
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar">
                </button>
            </div>

            <div class="modal-body">

                <form id="formNovaSala">

                    <div class="mb-3">
                        <label class="form-label">Nome da sala</label>

                        <input type="text"
                               class="form-control"
                               id="nomeSala"
                               placeholder="Ex: Lab 01"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo</label>

                        <select class="form-control"
                                id="tipoSala"
                                required>

                            <option value="">Selecione o tipo</option>
                            <option value="SALA_AULA">Sala de Aula</option>
                            <option value="LABORATORIO">Laboratório</option>
                            <option value="AUDITORIO">Auditório</option>
                            <option value="SALA_REUNIAO">Sala de Reunião</option>
                            <option value="BIBLIOTECA">Biblioteca</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Capacidade</label>

                        <input type="number"
                               class="form-control"
                               id="capacidadeSala"
                               placeholder="Ex: 30"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Localização</label>

                        <input type="text"
                               class="form-control"
                               id="localizacaoSala"
                               placeholder="Ex: Bloco A - 2º andar">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descrição</label>

                        <textarea class="form-control"
                                  id="descricaoSala"
                                  rows="2"
                                  placeholder="Ex: Laboratório com computadores para aulas práticas"></textarea>
                    </div>

                    <div class="mb-2">

                        <label class="form-label">
                            Recursos disponíveis
                        </label>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="possuiProjetor">

                            <label class="form-check-label"
                                   for="possuiProjetor">
                                Possui projetor
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="possuiTv">

                            <label class="form-check-label"
                                   for="possuiTv">
                                Possui TV
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="possuiMicrofone">

                            <label class="form-check-label"
                                   for="possuiMicrofone">
                                Possui microfone
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="possuiComputadores">

                            <label class="form-check-label"
                                   for="possuiComputadores">
                                Possui computadores
                            </label>
                        </div>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-light"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="button"
                        class="btn btn-success btn-salvar-sala">
                    Salvar
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/salas.js"></script>

</body>
</html>
