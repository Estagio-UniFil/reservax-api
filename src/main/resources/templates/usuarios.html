<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaX - Usuários</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css?v=2">
    <link rel="stylesheet" href="/css/admin.css?v=1">
    <link rel="stylesheet" href="/css/notificacoes.css?v=1">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-box">R</div>
            <h2>ReservaX</h2>
        </div>

        <nav class="menu" aria-label="Menu principal">
            <a href="/">▦ <span>Dashboard</span></a>
            <a href="/gerenciar-solicitacoes">▣ <span>Gerenciar Solicitações</span></a>
            <a href="/salas">▤ <span>Ambientes</span></a>
            <a href="/usuarios" class="active">👥 <span>Usuários</span></a>
            <a href="/configuracoes">⚙ <span>Configurações</span></a>
        </nav>

        <button type="button" class="logout" data-acao-sair>↪ <span>Sair</span></button>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Usuários</h1>

            <div class="user-area">
                <div class="notificacoes-area">
                    <button id="botaoNotificacoes" class="botao-notificacoes" type="button" aria-label="Notificações" aria-expanded="false">
                        🔔
                        <span id="bolinhaNotificacao" class="bolinha-notificacao" hidden></span>
                    </button>
                    <div id="painelNotificacoes" class="painel-notificacoes" hidden>
                        <h2>Notificações</h2>
                        <div id="listaNotificacoes" class="lista-notificacoes"></div>
                    </div>
                </div>
                <div class="divider"></div>
                <div class="avatar">R</div>
                <div>
                    <strong data-usuario-nome>Mario</strong>
                    <p data-usuario-tipo>Administrador</p>
                </div>
            </div>
        </header>

        <section class="page-body">
            <div class="acoes-pagina">
                <div id="mensagemUsuarios"></div>
                <button id="botaoNovoUsuario" class="botao-laranja" type="button">
                    + Novo usuário
                </button>
            </div>

            <section class="admin-card">
                <div class="tabela-container">
                    <table class="table tabela-reservas tabela-admin">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Tipo</th>
                                <th>Situação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaUsuarios"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</div>

<div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="tituloModalUsuario" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="tituloModalUsuario">Novo usuário</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form id="formUsuario">
                    <input id="usuarioId" type="hidden">

                    <div class="mb-3">
                        <label class="form-label" for="usuarioNome">Nome</label>
                        <input id="usuarioNome" class="form-control" type="text" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="usuarioEmail">E-mail</label>
                        <input id="usuarioEmail" class="form-control" type="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="usuarioTipo">Tipo de usuário</label>
                        <select id="usuarioTipo" class="form-control" required>
                            <option value="USUARIO">Usuário</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                        <small id="ajudaTipoUsuario" class="text-muted">
                            Administradores possuem acesso completo ao sistema.
                        </small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="usuarioSenha">Senha</label>
                        <input id="usuarioSenha" class="form-control" type="password" minlength="6">
                        <small id="ajudaSenha" class="text-muted">Mínimo de 6 caracteres.</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="botao-laranja" form="formUsuario">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js?v=1"></script>
<script src="/js/notificacoes.js?v=1"></script>
<script src="/js/usuarios.js?v=1"></script>
</body>
</html>
