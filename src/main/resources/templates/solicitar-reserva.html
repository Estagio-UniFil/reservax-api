<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ReservaX - Solicitar Reserva</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/solicitar-reserva.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-box">R</div>
            <h2>ReservaX</h2>
        </div>

        <nav class="menu">
            <a href="#">▦ <span>Dashboard</span></a>
            <a href="#" class="active">▣ <span>Solicitar Reserva</span></a>
            <a href="/minhas-reservas">◷ <span>Minhas reservas</span></a>
            <a href="/salas">▤ <span>Ambientes</span></a>
            <a href="#">👥 <span>Usuários</span></a>
            <a href="#">⚙ <span>Configurações</span></a>
        </nav>

        <a href="#" class="logout">↪ <span>Sair</span></a>
    </aside>

    <main class="content">

        <header class="topbar">
            <h1>Solicitar Reserva</h1>

            <div class="user-area">
                <div class="bell">🔔</div>
                <div class="divider"></div>
                <div class="avatar">R</div>

                <div>
                    <strong>Tiago Galvão</strong>
                    <p>Coordenador</p>
                </div>
            </div>
        </header>

        <section class="page-body">

            <div class="form-card">

                <h2>Nova solicitação de reserva</h2>
                <p class="subtitle">Preencha os dados abaixo para solicitar uma reserva de ambiente.</p>

                <div id="mensagemReserva"></div>

                <form id="formReserva">

                    <div class="reserva-card">
                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ambiente</label>
                                <select class="form-control" id="ambienteReserva" required>
                                    <option value="">Selecione um ambiente</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Solicitante</label>
                                <input type="text"
                                       class="form-control"
                                       id="solicitanteReserva"
                                       placeholder="Ex: Marcos Vinicios"
                                       required>
                            </div>

                        </div>
                    </div>

                    <div class="reserva-card">
                        <div class="row">

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Data</label>
                                <input type="date"
                                       class="form-control"
                                       id="dataReserva"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Horário de início</label>
                                <input type="time"
                                       class="form-control"
                                       id="horaInicioReserva"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Horário de término</label>
                                <input type="time"
                                       class="form-control"
                                       id="horaFimReserva"
                                       required>
                            </div>

                        </div>
                    </div>

                    <div class="reserva-card">
                        <div class="info-ambiente" id="infoAmbiente">
                            <strong>Capacidade:</strong> -
                            <br>
                            <strong>Localização:</strong> -
                            <br>
                            <strong>Recursos:</strong> -
                        </div>
                    </div>

                    <div class="reserva-card">
                        <div class="mb-3">
                            <label class="form-label">Observação</label>
                            <textarea class="form-control"
                                      id="observacaoReserva"
                                      rows="3"
                                      placeholder="Ex: Reserva para apresentação da pré-banca"></textarea>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="reset" class="btn btn-light">
                            Limpar
                        </button>

                        <button type="submit" class="btn btn-success">
                            Solicitar reserva
                        </button>
                    </div>

                </form>

            </div>

        </section>

    </main>

</div>

<script src="/js/solicitar-reserva.js"></script>

</body>
</html>
