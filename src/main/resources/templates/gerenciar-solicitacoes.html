<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaX - Gerenciar Solicitações</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css?v=2">
    <link rel="stylesheet" href="/css/admin.css?v=1">
    <link rel="stylesheet" href="/css/notificacoes.css?v=1">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-box">R</div>
            <h2>ReservaX</h2>
        </div>

        <nav class="menu" aria-label="Menu principal">
            <a href="/">▦ <span>Dashboard</span></a>
            <a href="/gerenciar-solicitacoes" class="active">▣ <span>Gerenciar Solicitações</span></a>
            <a href="/salas">▤ <span>Ambientes</span></a>
            <a href="/usuarios">👥 <span>Usuários</span></a>
            <a href="/configuracoes">⚙ <span>Configurações</span></a>
        </nav>

        <button type="button" class="logout" data-acao-sair>↪ <span>Sair</span></button>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1>Gerenciar Solicitações</h1>

            <div class="user-area">
                <div class="notificacoes-area">
                    <button id="botaoNotificacoes" class="botao-notificacoes" type="button" aria-label="Notificações" aria-expanded="false">
                        🔔
                        <span id="bolinhaNotificacao" class="bolinha-notificacao" hidden></span>
                    </button>
                    <div id="painelNotificacoes" class="painel-notificacoes" hidden>
                        <h2>Notificações</h2>
                        <div id="listaNotificacoes" class="lista-notificacoes"></div>
                    </div>
                </div>
                <div class="divider"></div>
                <div class="avatar">R</div>
                <div>
                    <strong data-usuario-nome>Mario</strong>
                    <p data-usuario-tipo>Administrador</p>
                </div>
            </div>
        </header>

        <section class="page-body">
            <div id="mensagemSolicitacoes"></div>

            <section class="admin-card">
                <div class="tabela-container">
                    <table class="table tabela-reservas tabela-admin">
                        <thead>
                            <tr>
                                <th>Ambiente</th>
                                <th>Data</th>
                                <th>Horário</th>
                                <th>Solicitante</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaSolicitacoes"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</div>

<script src="/js/api.js?v=1"></script>
<script src="/js/notificacoes.js?v=1"></script>
<script src="/js/gerenciar-solicitacoes.js?v=1"></script>
</body>
</html>
